
spring.application.name=money-here-api
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Banco Neon PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
spring.flyway.user=${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

# O SMTP é opcional na execução local.
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
