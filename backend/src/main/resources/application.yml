spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
app:
  jwt-secret: ${JWT_SECRET}
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006}
  mail-from: ${MAIL_FROM:}
  public-url: ${PUBLIC_URL:http://localhost:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
